# Recette overlay on top of compose.yaml (iso-prod).
#
# Keeps the prod topology untouched (APP_ENV=prod, read_only, JWT secrets) and ONLY
# adds a Mailcatcher service (capture magic-link emails for the real auth flow).
#
# Load EXPLICITLY (never auto-loaded): docker compose -f compose.yaml -f compose.recette.yaml ...
# Named compose.recette.yaml (not compose.override.yaml) to avoid implicit auto-load.
# JWT keys + passphrase are wired here (overrides below), so `make start-recette`
# and `make provision-recette` no longer pass JWT_* on the command line; they only
# generate the keypair under .docker/jwt-recette/ (openssl) when missing. Valhalla
# (re-routing) stays opt-in via `--profile routing` + a regional OSM extract.

# Recette JWT secrets: the keypair lives under .docker/jwt-recette/ (generated by
# `make start-recette`). Overriding the top-level secrets here points the prod
# `jwt_private_key` / `jwt_public_key` Docker secrets at those files, so the
# JWT_PRIVATE_KEY_PATH / JWT_PUBLIC_KEY_PATH env vars are no longer needed.
secrets:
  jwt_private_key:
    file: .docker/jwt-recette/private.pem
  jwt_public_key:
    file: .docker/jwt-recette/public.pem

# Shared env for php/worker — extension field + YAML merge key to avoid
# duplicating the block across the services (review #612).
x-recette-env: &recette-env
  MAILER_DSN: smtp://mailcatcher:1025
  JWT_PASSPHRASE: recette
  # Non-default Mercure key so the SEC-004 fail-closed boot guard passes locally.
  # Publisher/subscriber/secret must match for the embedded hub to verify the
  # app-issued subscriber tokens (HS256, which needs a >=256-bit / >=32-byte key).
  MERCURE_PUBLISHER_JWT_KEY: recette-mercure-jwt-secret-min-32-bytes
  MERCURE_SUBSCRIBER_JWT_KEY: recette-mercure-jwt-secret-min-32-bytes
  MERCURE_JWT_SECRET: recette-mercure-jwt-secret-min-32-bytes
  # Non-default token-encryption key so the SEC-003 fail-closed boot guard passes
  # locally (encrypts refresh tokens at rest).
  REFRESH_TOKEN_ENC_KEY: recette-refresh-token-enc-key
  # Non-empty secret so AccessRequestHmacService boots (ADR-029): the early-access
  # confirmation email is signed with it. Prod stays fail-closed on the empty default.
  ACCESS_REQUEST_HMAC_SECRET: recette-access-request-hmac-secret
  # Push notifications (epic #1051). Empty in recette: FcmCredentials fails closed
  # only on an actual send, so the rest of the stack boots without a real FCM key.
  FCM_SERVICE_ACCOUNT_JSON: "${FCM_SERVICE_ACCOUNT_JSON:-}"

services:
  php:
    environment:
      <<: *recette-env

  worker:
    environment:
      <<: *recette-env

  pwa:
    environment:
      # Android App Links (ADR-053): recette is exercised on-device (via ngrok)
      # with a DEBUG build, so it must serve the debug keystore association for the
      # https App Link to verify. Prod (compose.yaml) stays empty until the release
      # signing-cert fingerprint is added (Sprint 59).
      ANDROID_APP_PACKAGE: "${ANDROID_APP_PACKAGE:-coop.lestilleuls.biketripplanner}"
      ANDROID_SHA256_CERT_FINGERPRINTS: "${ANDROID_SHA256_CERT_FINGERPRINTS:-FA:C6:17:45:DC:09:03:78:6F:B9:ED:E6:2A:96:2B:39:9F:73:48:F0:BB:6F:89:9B:83:32:66:75:91:03:3B:9C}"

  mailcatcher:
    # Pinned by digest: schickling/mailcatcher has no versioned tags, and the
    # mutable tag would let an upstream rebuild change the HTTP API recette-seed.sh relies on.
    image: schickling/mailcatcher@sha256:55ed289525a565f7587b138a423705267eb34eda1ec8d35acd6dc7966a933e84
    restart: unless-stopped
    ports:
      - target: 1080
        published: ${MAILCATCHER_PORT:-1080}
        protocol: tcp
    healthcheck:
      test: ["CMD-SHELL", "ruby -e \"require 'net/http'; Net::HTTP.get(URI('http://localhost:1080'))\" || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
