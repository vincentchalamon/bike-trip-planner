---
- name: Set the system timezone
  community.general.timezone:
    name: "{{ timezone }}"

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ common_base_packages }}"
    state: present

- name: Enable unattended security upgrades
  ansible.builtin.service:
    name: unattended-upgrades
    enabled: true
    state: started

- name: Create the deploy user
  ansible.builtin.user:
    name: "{{ deploy_user }}"
    shell: /bin/bash
    create_home: true
    state: present

# exclusive + every key in one call: a key removed from the list is revoked,
# so a rotation (new key in, old key out, re-run) actually retires the old one.
- name: Install the deploy authorized_keys (GHA SSH)
  ansible.posix.authorized_key:
    user: "{{ deploy_user }}"
    key: "{{ deploy_ssh_public_keys | join('\n') }}"
    state: present
    exclusive: true
  when: deploy_ssh_public_keys | length > 0

- name: Create the preview deploy user
  ansible.builtin.user:
    name: "{{ preview_deploy_user }}"
    shell: /bin/bash
    create_home: true
    state: present

- name: Refuse a preview deploy key that is also a prod deploy key
  ansible.builtin.assert:
    that:
      - preview_deploy_ssh_public_keys | intersect(deploy_ssh_public_keys) | length == 0
    fail_msg: >-
      preview_deploy_ssh_public_keys must not contain a key from deploy_ssh_public_keys:
      the preview key is readable by pull_request runs, the prod one must not be.
    quiet: true

# exclusive + every key in one call: a key removed from the list is revoked.
# `restrict` drops pty/forwarding; command= ignores whatever the client asks to
# run and hands it to btp-preview as SSH_ORIGINAL_COMMAND.
- name: Install the preview deploy authorized_keys (forced command)
  ansible.posix.authorized_key:
    user: "{{ preview_deploy_user }}"
    key: "{{ preview_deploy_ssh_public_keys | join('\n') }}"
    key_options: 'restrict,command="/usr/local/bin/btp-preview"'
    state: present
    exclusive: true
  when: preview_deploy_ssh_public_keys | length > 0

- name: Create the secrets root directory
  ansible.builtin.file:
    path: "{{ etc_dir }}"
    state: directory
    owner: root
    group: "{{ deploy_user }}"
    mode: "0750"

- name: Create the JWT keypair directory
  ansible.builtin.file:
    path: "{{ jwt_dir }}"
    state: directory
    owner: root
    group: "{{ deploy_user }}"
    mode: "0750"

- name: Create the OAuth keypair directory
  ansible.builtin.file:
    path: "{{ oauth_dir }}"
    state: directory
    owner: root
    group: "{{ deploy_user }}"
    mode: "0750"

# --- Anti-reclaim heartbeat (optional, plan W5.1) ----------------------------
# Unit files are rendered unconditionally so the enable/start task below can
# ALSO disable/stop the timer when enable_reclaim_heartbeat flips back to false
# (a `when`-guarded systemd task would silently skip and leave a stale timer
# running — breaking the "idempotent, re-run any time" guarantee).
- name: Install the anti-reclaim heartbeat service
  ansible.builtin.template:
    src: reclaim-heartbeat.service.j2
    dest: /etc/systemd/system/btp-reclaim-heartbeat.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Install the anti-reclaim heartbeat timer
  ansible.builtin.template:
    src: reclaim-heartbeat.timer.j2
    dest: /etc/systemd/system/btp-reclaim-heartbeat.timer
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Toggle the anti-reclaim heartbeat timer
  ansible.builtin.systemd_service:
    name: btp-reclaim-heartbeat.timer
    enabled: "{{ enable_reclaim_heartbeat | bool }}"
    state: "{{ 'started' if enable_reclaim_heartbeat | bool else 'stopped' }}"
    daemon_reload: true
