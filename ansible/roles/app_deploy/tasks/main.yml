---
- name: Create the app directory
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0755"

# The checkout exists so `docker compose` bind mounts (Caddyfile, conf.d,
# overlays, deploy/valhalla/compose.yaml) resolve. The actual prod stack
# `up -d` is done by GHA deploy-prod via the rendered deploy-prod.sh hook
# below - Ansible does NOT bring the app stack up.
#
# `update: false`: Ansible clones once and never moves the checkout again. The
# deploy owns the revision (it checks out the release tag), and btp-compose
# derives the image tags from that checkout; resetting it to a branch here would
# leave the compose files out of step with the images in service and make every
# btp-compose call refuse to run until the next deploy.
- name: Clone the application repository (first run only)
  become: true
  become_user: "{{ deploy_user }}"
  ansible.builtin.git:
    repo: "{{ app_repo_url }}"
    dest: "{{ app_dir }}"
    version: "{{ app_deploy_ref }}"
    update: false

# The php entrypoint refuses to boot when these two pairs match, because that difference is
# the only thing keeping a PWA session token off /mcp (ADR-079). Checking it here turns a
# crash-looping container at cutover into a playbook that stops before writing anything —
# and it is the one place that can see both values at once, since Vault holds them and the
# VM only ever receives the files.
# Redis requires a password (SEC-21); compose puts it verbatim in the DSNs.
- name: Refuse a Redis password that is not URL-safe
  ansible.builtin.assert:
    that:
      - vault_redis_password is match('^[0-9a-fA-F]{32,}$')
    fail_msg: vault_redis_password must be hex, at least 32 characters (openssl rand -hex 32).
    quiet: true
  no_log: true

- name: Refuse a Vault where the OAuth keypair is the JWT one
  ansible.builtin.assert:
    that:
      - vault_oauth_private_key | trim != vault_jwt_private_key | trim
      - vault_oauth_public_key | trim != vault_jwt_public_key | trim
    fail_msg: >-
      The OAuth authorization server must have its OWN keypair (ADR-079). Sharing Lexik's
      would let a PWA session token open /mcp, and the php entrypoint refuses to boot on it.
      Generate a second pair off-VM and put it in vault_oauth_private_key /
      vault_oauth_public_key.
    quiet: true
  no_log: true

- name: Write the JWT private key (from Vault)
  ansible.builtin.copy:
    content: "{{ vault_jwt_private_key }}"
    dest: "{{ jwt_dir }}/private.pem"
    owner: root
    group: "{{ deploy_user }}"
    mode: "0640"
  no_log: true

- name: Write the JWT public key (from Vault)
  ansible.builtin.copy:
    content: "{{ vault_jwt_public_key }}"
    dest: "{{ jwt_dir }}/public.pem"
    owner: root
    group: "{{ deploy_user }}"
    mode: "0640"
  no_log: true

# A DIFFERENT keypair from the two above (ADR-079). Vault must hold a genuinely separate
# pair: the php entrypoint compares the files and refuses to boot when they match, which
# is the only thing keeping a PWA session token off /mcp.
- name: Write the OAuth private key (from Vault)
  ansible.builtin.copy:
    content: "{{ vault_oauth_private_key }}"
    dest: "{{ oauth_dir }}/private.pem"
    owner: root
    group: "{{ deploy_user }}"
    mode: "0640"
  no_log: true

- name: Write the OAuth public key (from Vault)
  ansible.builtin.copy:
    content: "{{ vault_oauth_public_key }}"
    dest: "{{ oauth_dir }}/public.pem"
    owner: root
    group: "{{ deploy_user }}"
    mode: "0640"
  no_log: true

# assetlinks.json delegates the App Links (magic links included) to whoever signs
# with these certificates: refuse a placeholder and the public debug keystore.
- name: Refuse Android App Link fingerprints that are not a release keystore's
  vars:
    btp_android_debug_fingerprint: "FA:C6:17:45:DC:09:03:78:6F:B9:ED:E6:2A:96:2B:39:9F:73:48:F0:BB:6F:89:9B:83:32:66:75:91:03:3B:9C"
    btp_android_fingerprints: "{{ android_sha256_cert_fingerprints.split(',') | map('trim') | map('upper') | list }}"
  ansible.builtin.assert:
    that:
      - btp_android_fingerprints | length > 0
      - btp_android_fingerprints | reject('match', '^([0-9A-F]{2}:){31}[0-9A-F]{2}$') | list | length == 0
      - btp_android_debug_fingerprint not in btp_android_fingerprints
    fail_msg: >-
      android_sha256_cert_fingerprints must list the SHA-256 fingerprint(s) of the private
      release keystore (AA:BB:... format), never the public Expo debug keystore's. See
      docs/runbooks/mobile-release-build.md.
    quiet: true

# Rendered OUTSIDE app_dir on purpose. The repo now versions a `.env` holding the
# dev defaults, and deploy-prod runs `git checkout --force <tag>` in app_dir — a
# prod env file living there would be overwritten by every deploy, booting the
# stack with empty secrets. deploy-prod passes this path via `--env-file`, which
# also stops compose auto-loading the repo's `.env`.
- name: Render the prod env file (all runtime secrets relocated from Coolify)
  ansible.builtin.template:
    src: env.j2
    dest: "{{ etc_dir }}/app.env"
    owner: root
    group: "{{ deploy_user }}"
    mode: "0640"
  no_log: true

# Written by deploy-prod.sh (as the deploy user), read by btp-compose. Not in
# app_dir: a forced checkout must not touch it.
- name: Create the release records directory
  ansible.builtin.file:
    path: "{{ release_records_dir }}"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0750"

- name: Install the prod compose wrapper (btp-compose)
  ansible.builtin.template:
    src: btp-compose.j2
    dest: /usr/local/bin/btp-compose
    owner: root
    group: root
    mode: "0755"

- name: Render the prod deploy hook
  ansible.builtin.template:
    src: deploy-prod.sh.j2
    dest: "{{ app_dir }}/deploy-prod.sh"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0755"

# --- PR previews ---------------------------------------------------------------
# The preview user owns its root and the `base` checkout; it can read neither
# app.env, the prod keypairs nor the prod checkout. preview.env and the preview
# keypairs are rendered from Vault (vault_preview_*), root:{{ preview_deploy_user }}
# 0640, and must not reuse a single prod value: a preview runs unreviewed code,
# and a shared APP_SECRET / MERCURE_JWT_KEY / keypair would let it forge what
# prod trusts (SEC-20).
- name: Refuse preview secrets equal to their prod counterpart
  ansible.builtin.assert:
    that:
      - vault_preview_app_secret != vault_app_secret
      - vault_preview_mercure_jwt_key != vault_mercure_jwt_key
      - vault_preview_refresh_token_enc_key != vault_refresh_token_enc_key
      - vault_preview_access_request_hmac_secret != vault_access_request_hmac_secret
      - vault_preview_oauth_encryption_key != vault_oauth_encryption_key
      - vault_preview_database_password != vault_database_password
      - vault_preview_redis_password != vault_redis_password
      - vault_preview_jwt_public_key | trim not in [vault_jwt_public_key | trim, vault_oauth_public_key | trim]
      - vault_preview_oauth_public_key | trim not in [vault_jwt_public_key | trim, vault_oauth_public_key | trim, vault_preview_jwt_public_key | trim]
      - vault_preview_redis_password is match('^[0-9a-fA-F]{32,}$')
    fail_msg: >-
      Every vault_preview_* secret must differ from its prod value (and the two preview
      keypairs from each other and from prod's), and vault_preview_redis_password must be
      hex, at least 32 characters (it goes verbatim into the Redis DSNs).
    quiet: true
  no_log: true

- name: Create the preview root
  ansible.builtin.file:
    path: "{{ preview_root }}"
    state: directory
    owner: "{{ preview_deploy_user }}"
    group: "{{ preview_deploy_user }}"
    mode: "0750"

- name: Create the preview keypair directories
  ansible.builtin.file:
    path: "{{ preview_root }}/{{ item }}"
    state: directory
    owner: root
    group: "{{ preview_deploy_user }}"
    mode: "0750"
  loop:
    - jwt
    - oauth

- name: Write the preview keypairs (from Vault)
  ansible.builtin.copy:
    content: "{{ item.content }}"
    dest: "{{ preview_root }}/{{ item.dest }}"
    owner: root
    group: "{{ preview_deploy_user }}"
    mode: "0640"
  loop:
    - { dest: jwt/private.pem, content: "{{ vault_preview_jwt_private_key }}" }
    - { dest: jwt/public.pem, content: "{{ vault_preview_jwt_public_key }}" }
    - { dest: oauth/private.pem, content: "{{ vault_preview_oauth_private_key }}" }
    - { dest: oauth/public.pem, content: "{{ vault_preview_oauth_public_key }}" }
  loop_control:
    label: "{{ item.dest }}"
  no_log: true

- name: Render the preview env file (from Vault)
  ansible.builtin.template:
    src: preview-env.j2
    dest: "{{ preview_root }}/preview.env"
    owner: root
    group: "{{ preview_deploy_user }}"
    mode: "0640"
  no_log: true

# The compose files every preview runs. btp-preview moves it to the tip of
# preview_base_ref on each deploy; Ansible only clones it once.
- name: Clone the preview base checkout (first run only)
  become: true
  become_user: "{{ preview_deploy_user }}"
  ansible.builtin.git:
    repo: "{{ app_repo_url }}"
    dest: "{{ preview_root }}/base"
    version: "{{ preview_base_ref }}"
    update: false

# Root-owned: the preview user runs it, cannot change it.
- name: Install the preview forced command (btp-preview)
  ansible.builtin.template:
    src: btp-preview.j2
    dest: /usr/local/bin/btp-preview
    owner: root
    group: root
    mode: "0755"

# --- events-refresh timer (optional in beta, plan W5.1) ----------------------
# Unit files rendered unconditionally so the toggle task below can also
# disable/stop the timer when enable_events_refresh_timer flips back to false
# (a `when`-guarded systemd task would skip and leave a stale timer running).
- name: Install the events-refresh service
  ansible.builtin.template:
    src: events-refresh.service.j2
    dest: /etc/systemd/system/btp-events-refresh.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Install the events-refresh timer
  ansible.builtin.template:
    src: events-refresh.timer.j2
    dest: /etc/systemd/system/btp-events-refresh.timer
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Toggle the events-refresh timer
  ansible.builtin.systemd_service:
    name: btp-events-refresh.timer
    enabled: "{{ enable_events_refresh_timer | bool }}"
    state: "{{ 'started' if enable_events_refresh_timer | bool else 'stopped' }}"
    daemon_reload: true
