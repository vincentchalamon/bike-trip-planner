---
- name: Create the cloudflared directory
  ansible.builtin.file:
    path: "{{ cloudflared_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the tunnel credentials (from Vault)
  ansible.builtin.copy:
    content: "{{ vault_cloudflared_tunnel_credentials }}"
    dest: "{{ cloudflared_dir }}/credentials.json"
    owner: root
    group: root
    # The official cloudflared image runs as the distroless nonroot user
    # (UID 65532); it must be able to read this file, and the only local
    # principals on the VM are root and deploy. Same rationale as config.yml.
    mode: "0644"
  no_log: true
  notify: Restart cloudflared

- name: Render the locally-managed tunnel config
  ansible.builtin.template:
    src: config.yml.j2
    dest: "{{ cloudflared_dir }}/config.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart cloudflared

- name: Render the cloudflared compose file
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ cloudflared_dir }}/compose.yaml"
    owner: root
    group: root
    mode: "0644"

- name: Deploy cloudflared
  community.docker.docker_compose_v2:
    project_src: "{{ cloudflared_dir }}"
    state: present
