---
- name: Create the Docker apt keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Add the Docker apt GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"

- name: Add the Docker apt repository (arm64)
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch=arm64 signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
    filename: docker
    state: present

- name: Install Docker Engine + compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Enable and start Docker
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started

- name: Add the deploy user to the docker group
  ansible.builtin.user:
    name: "{{ deploy_user }}"
    groups: docker
    append: true

- name: Create the shared Docker networks (edge, btp-shared)
  community.docker.docker_network:
    name: "{{ item }}"
    state: present
  loop: "{{ docker_networks }}"

- name: Log in to GHCR (only when the images are private)
  community.docker.docker_login:
    registry_url: ghcr.io
    username: "{{ vault_ghcr_username }}"
    password: "{{ vault_ghcr_token }}"
  when: ghcr_login_enabled | bool
  no_log: true
