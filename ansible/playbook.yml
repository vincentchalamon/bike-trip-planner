---
# Bootstrap + reclaim recovery for the Oracle ARM VM (plan W5).
# Idempotent: re-running it re-converges the VM. A full reclaim recovery
# (fresh VM) is exactly this same playbook — see docs/runbooks/oracle-vm-reclaimed.md.
#
#   ansible-galaxy collection install -r requirements.yml
#   ansible-playbook -i inventory.ini playbook.yml --ask-vault-pass
#
- name: Bootstrap the Oracle ARM VM for bike-trip-planner
  hosts: btp
  become: true
  vars_files:
    # Vault-encrypted; not committed. Create it from vault.yml.example (see README).
    - vault.yml
  roles:
    - role: common
    - role: docker
    - role: traefik
    - role: cloudflared
    # app_deploy clones the repo before shared_infra, which needs
    # deploy/valhalla/compose.yaml from the checkout.
    - role: app_deploy
    - role: shared_infra
    # Nightly pg_dump of PG-app -> age -> rclone to B2/OCI, GFS retention, via a
    # systemd timer (no Coolify); on-demand with `make backup-now`. PG-reference
    # is not backed up (reproducible, ADR-060). See plan W10 and
    # docs/adr/adr-062-backup-and-disaster-recovery.md.
    - role: backup
