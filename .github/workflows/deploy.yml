name: Deploy

on:
  # Prod deploys only on a version tag: a tag marks a deliberate stable release
  # and a clear rollback point (deploy-prod is gated on github.ref_type == 'tag').
  push:
    tags: ['v*']
  # PRs build (and, same-repo, push) a pr-<n> image for the preview stacks (W3),
  # then deploy-preview rolls the per-PR stack. `closed` is included so
  # teardown-preview can drop the stack when the PR is closed/merged; build-images
  # and deploy-preview guard themselves off the `closed` action.
  # Restricted to same-repo PRs at the job level so forks never build or push.
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: vincentchalamon/bike-trip-planner

jobs:
  build-images:
    name: Build & push ${{ matrix.service }} image
    # Native arm64 hosted runner (GA, free for public repos) — replaces the slow
    # QEMU emulation on ubuntu-latest. If these runners are ever unavailable for
    # this repo, fall back to `runs-on: ubuntu-latest` + the setup-qemu-action
    # step (removed below) with `platforms: arm64`.
    runs-on: ubuntu-24.04-arm
    # Same-repo only: a fork PR must never build or push to our GHCR. Never on a
    # `closed` PR (that event only drives teardown-preview — nothing to build).
    if: >-
      github.event.action != 'closed' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: php
            dockerfile: .docker/php/Dockerfile
            target: frankenphp_prod
          - service: pwa
            dockerfile: .docker/pwa/Dockerfile
            target: prod
          - service: provisioner
            dockerfile: .docker/provisioner/Dockerfile
            target: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # No QEMU: the runner is natively arm64, so buildx builds linux/arm64 directly.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          PR_NUMBER: ${{ github.event.number }}
          SHA: ${{ github.sha }}
          SERVICE: ${{ matrix.service }}
        run: |
          IMAGE="${REGISTRY}/${IMAGE_OWNER}-${SERVICE}"
          TAGS="${IMAGE}:${SHA}"
          if [ "${REF_TYPE}" = "tag" ]; then
            TAGS="${TAGS},${IMAGE}:${REF_NAME}"
          elif [ "${EVENT_NAME}" = "pull_request" ]; then
            # Preview stacks (W3) pull this by the deterministic pr-<n> tag.
            TAGS="${TAGS},${IMAGE}:pr-${PR_NUMBER}"
          fi
          {
            echo "tags=${TAGS}"
            echo "image=${IMAGE}"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            NEXT_PUBLIC_APP_RELEASE=${{ github.sha }}
            NEXT_PUBLIC_APP_ENV=production
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          # SENTRY_AUTH_TOKEN is intentionally NOT mounted here. Without it
          # withSentryConfig is a no-op, so the deployed image never emits the
          # `.map` files (deleteSourcemapsAfterUpload only deletes *after* a
          # successful upload, which needs org/project/url absent from this
          # build). Source-map upload to GlitchTip happens in the dedicated
          # `upload-sourcemaps` job, which builds with all SENTRY_* present.
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
          provenance: false

      # Keep the registry tidy: retain the 10 most recent versions of each
      # image (enough rollback targets) and prune the rest. GHCR storage is
      # free for this public repo, so this is hygiene, not a cost control.
      # ignore-versions protects the vX.Y.Z release images from PR-build churn:
      # deploy-prod's rollback story ("re-run on an earlier tag") needs them to
      # survive even after >10 pr-<n>/sha builds between two releases.
      - name: Prune old image versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: bike-trip-planner-${{ matrix.service }}
          package-type: container
          min-versions-to-keep: 10
          ignore-versions: '^v[0-9]+\.[0-9]+\.[0-9]+$'

  upload-sourcemaps:
    name: Upload PWA source maps to GlitchTip
    runs-on: ubuntu-latest
    needs: build-images
    # Source maps track a released bundle only — skip on PR builds.
    if: github.ref_type == 'tag'
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_URL: ${{ secrets.SENTRY_URL }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
      SHA: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Skip when Sentry/GlitchTip is not configured
        id: gate
        run: |
          if [ -z "${SENTRY_AUTH_TOKEN}" ] || [ -z "${SENTRY_URL}" ] || [ -z "${SENTRY_ORG}" ] || [ -z "${SENTRY_PROJECT}" ]; then
            echo "Sentry/GlitchTip secrets missing — skipping source map upload."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: pwa/package-lock.json

      - name: Install PWA dependencies
        if: steps.gate.outputs.skip != 'true'
        working-directory: pwa
        run: npm ci

      - name: Build PWA and upload source maps via withSentryConfig
        if: steps.gate.outputs.skip != 'true'
        working-directory: pwa
        # withSentryConfig creates the release and uploads the source maps during
        # the build itself (all four SENTRY_* vars are present in this job's env),
        # then deletes the .map files (deleteSourcemapsAfterUpload). A separate
        # `@sentry/cli releases files upload-sourcemaps` step would find nothing —
        # so it is intentionally omitted; the plugin owns the upload.
        #
        # These NEXT_PUBLIC_* values MUST mirror the Docker image build args
        # exactly — any divergence changes the inlined config and the emitted
        # chunk hashes, so the uploaded maps would no longer match the deployed
        # bundle and symbolication would silently fail.
        env:
          NEXT_PUBLIC_APP_RELEASE: ${{ github.sha }}
          NEXT_PUBLIC_APP_ENV: production
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
        run: npm run build

  deploy-prod:
    name: Deploy tag to the prod VM over SSH
    runs-on: ubuntu-latest
    # Source-map upload is a diagnostic aid, not a deploy gate: GlitchTip shares
    # the Oracle VM and is most likely degraded during a heavy deploy, so a
    # transient @sentry/cli failure must not block shipping the new images.
    needs: build-images
    # Prod = version tags only. Rollback = re-run this job on an earlier tag.
    if: github.ref_type == 'tag'
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
      # Pinned host key (optional). When set, it is trusted instead of scanning
      # the host live (TOFU). Populate once W5 (Ansible/SSH infra) is in place.
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
      # Repo checkout path on the VM (Ansible-provisioned). Defaults if unset.
      REPO_DIR: ${{ secrets.PROD_REPO_DIR }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Deploy over SSH
        # No-op when SSH secrets are absent — same transition-safety contract as
        # the former Coolify webhook. Until the Ansible/SSH infra is in place, a
        # tag push builds+pushes images and this job cleanly skips the deploy, so
        # merging to main (and the old Coolify prod) is never disturbed. Cutover
        # is the first `v*` tag after the SSH secrets exist.
        run: |
          if [ -z "${SSH_HOST}" ] || [ -z "${SSH_USER}" ] || [ -z "${SSH_KEY}" ]; then
            echo "SSH_HOST/SSH_USER/SSH_KEY not configured - skipping prod deploy."
            exit 0
          fi
          repo_dir="${REPO_DIR:-/opt/bike-trip-planner}"
          # TAG is github.ref_name (the pushed tag). It is expanded on the runner
          # and re-parsed by the remote bash, so reject anything that isn't a plain
          # vMAJOR.MINOR.PATCH tag before it is ever interpolated — git tag names
          # may contain $(), backticks, etc., which would otherwise be RCE.
          if ! [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Refusing to deploy: TAG '${TAG}' is not a plain version tag" >&2
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "${SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Prefer a pinned host key (SSH_KNOWN_HOSTS secret) over TOFU: written
          # straight to known_hosts, it forbids the MITM window a live scan leaves
          # open on first contact. Falls back to ssh-keyscan when unset (beta
          # tradeoff, documented) — populate the secret once W5 (Ansible) lands.
          if [ -n "${SSH_KNOWN_HOSTS}" ]; then
            printf '%s\n' "${SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "${SSH_HOST}" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          # Check out the tag on the VM and roll the stack, pulling the images
          # this run just pushed by tag (--pull always). $repo_dir/$TAG expand on
          # the runner; the remote shell receives a fully-resolved script.
          ssh -i ~/.ssh/deploy_key "${SSH_USER}@${SSH_HOST}" bash -euo pipefail <<EOF
          cd "${repo_dir}"
          git fetch --tags --force
          git checkout --force "${TAG}"
          docker compose -p prod -f compose.yaml -f deploy/prod/compose.yaml up -d --pull always
          EOF

  smoke-test:
    name: Smoke test post-deploy
    runs-on: ubuntu-latest
    needs: deploy-prod
    # A tag-skipped deploy-prod counts as "success" for needs, so pin to tags:
    # never probe real prod (nor dispatch an incident) on a PR build.
    if: success() && github.ref_type == 'tag'
    # Prod host to probe. Defaults to the current value so nothing breaks before
    # cutover; set PROD_HEALTH_URL to https://www.${DOMAIN} at cutover.
    env:
      HEALTH_URL: ${{ secrets.PROD_HEALTH_URL || 'https://biketrip.mooo.com' }}
    steps:
      - name: Wait for the new image to roll
        run: sleep 60

      - name: Probe /api/healthz with retry
        run: |
          set +e
          for attempt in 1 2 3; do
            if curl -fsS --max-time 10 "${HEALTH_URL}/api/healthz"; then
              exit 0
            fi
            if [ "${attempt}" -lt 3 ]; then
              echo "Attempt ${attempt} failed, retrying in 30s..."
              sleep 30
            fi
          done
          exit 1

      - name: Probe /api/health and assert overall status
        run: |
          response=$(curl -fsS --max-time 10 "${HEALTH_URL}/api/health")
          echo "$response"
          # Trust the controller's own readiness verdict (its $required list
          # excludes optional deps like ollama), instead of asserting every
          # entry in .deps which would false-positive on an optional degradation.
          echo "$response" | jq -e '.status == "ok"'

      - name: Open incident on smoke-test failure
        if: failure()
        env:
          INCIDENT_TOKEN: ${{ secrets.INCIDENT_DISPATCH_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          if [ -z "${INCIDENT_TOKEN}" ]; then
            echo "INCIDENT_DISPATCH_TOKEN not configured — cannot raise incident."
            exit 1
          fi
          curl -fsS -X POST \
            "https://api.github.com/repos/${REPO}/dispatches" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${INCIDENT_TOKEN}" \
            -d "{\"event_type\":\"uptime_alert\",\"client_payload\":{\"source\":\"deploy-smoke\",\"sha\":\"${SHA}\",\"status\":\"down\"}}"

  deploy-preview:
    name: Deploy PR preview to the VM over SSH
    runs-on: ubuntu-latest
    needs: build-images
    # Same-repo PRs only (a fork must never reach the VM), and never on `closed`
    # (that action is teardown-preview's). deploy-preview shares the shared Valhalla
    # + PG-référence on btp-shared with prod; each PR gets its own isolated PG-app +
    # redis and its own pr-<n>.${DOMAIN} host.
    #
    # OPERATIONAL GUARD — concurrent-preview cap. Each preview budgets ~2 GB / ~2
    # vCPU (deploy/preview/compose.yaml caps). On the shared 24 GB / 4-core VM, prod
    # (~6-7 GB) leaves room for roughly 4-5 concurrent previews before contention.
    # There is no auto-eviction here: keep the count in check by closing stale PRs
    # (teardown-preview reclaims on close) and, if needed, cap open previews via
    # branch-protection / a manual review gate. Raising the cap means shrinking the
    # per-preview limits or growing the VM.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
      # Pinned host key (optional), same secret as deploy-prod — the VM is the same
      # SSH_HOST. Trusted instead of a live TOFU scan when set.
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
      REPO_DIR: ${{ secrets.PROD_REPO_DIR }}
      # Root for the per-PR checkouts, kept OUTSIDE the prod canonical dir so a
      # preview deploy never shares a working tree / .git index with prod.
      PREVIEW_ROOT: ${{ secrets.PREVIEW_REPO_ROOT }}
      # Dedicated NON-PROD env file for previews (see the deploy step). Never the
      # prod .env — previews must not inherit prod secrets.
      PREVIEW_ENV_FILE: ${{ secrets.PREVIEW_ENV_FILE }}
      PR_NUMBER: ${{ github.event.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Deploy preview over SSH
        # No-op when SSH secrets are absent — same transition-safety contract as
        # deploy-prod. Until the Ansible/SSH infra is in place, a PR builds+pushes
        # its pr-<n> images and this job cleanly skips, so merges to main (and the
        # old Coolify prod) are never disturbed.
        run: |
          if [ -z "${SSH_HOST}" ] || [ -z "${SSH_USER}" ] || [ -z "${SSH_KEY}" ]; then
            echo "SSH_HOST/SSH_USER/SSH_KEY not configured - skipping preview deploy."
            exit 0
          fi
          canonical_dir="${REPO_DIR:-/opt/bike-trip-planner}"
          # Dedicated checkout per PR, distinct from prod and from every other
          # preview: concurrent preview/prod deploys never race on one working tree.
          preview_dir="${PREVIEW_ROOT:-/opt/bike-trip-planner-previews}/pr-${PR_NUMBER}"
          # NON-PROD env file for previews. MUST NOT be the prod .env: compose.yaml
          # interpolates MAILER_DSN / REFRESH_TOKEN_ENC_KEY / ACCESS_REQUEST_HMAC_SECRET
          # / FCM_SERVICE_ACCOUNT_JSON / JWT_* / DB creds from it, and an ephemeral PR
          # preview must never inherit prod secrets.
          # TODO(PR-I / Ansible): provision this preview.env on the VM with
          #   preview-scoped, NON-PROD values — a dedicated Mercure key, dedicated
          #   REFRESH_TOKEN_ENC_KEY + ACCESS_REQUEST_HMAC_SECRET, a null/sink MAILER_DSN,
          #   empty FCM_SERVICE_ACCOUNT_JSON, the isolated preview PG-app creds, and the
          #   dedicated preview JWT keypair paths (PREVIEW_JWT_PRIVATE_KEY_PATH /
          #   PREVIEW_JWT_PUBLIC_KEY_PATH — distinct from prod, see deploy/preview
          #   secrets override) — plus the shared read-only values
          #   (REFERENCE_DATABASE_URL, VALHALLA_BASE_URI, DOMAIN). Defaults to a single
          #   shared file at the previews root (outside
          #   any pr-<n> dir, so teardown's rm -rf never deletes it); until it exists
          #   the deploy fails closed on the missing file rather than leak prod secrets.
          preview_env_file="${PREVIEW_ENV_FILE:-${PREVIEW_ROOT:-/opt/bike-trip-planner-previews}/preview.env}"
          # Pull the pr-<n> images this run's build-images just pushed to GHCR.
          php_image="${REGISTRY}/${IMAGE_OWNER}-php:pr-${PR_NUMBER}"
          pwa_image="${REGISTRY}/${IMAGE_OWNER}-pwa:pr-${PR_NUMBER}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "${SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Prefer the pinned host key (SSH_KNOWN_HOSTS) over a live TOFU scan — same
          # pattern as deploy-prod. Falls back to ssh-keyscan when unset (beta).
          if [ -n "${SSH_KNOWN_HOSTS}" ]; then
            printf '%s\n' "${SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "${SSH_HOST}" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          # First deploy clones the PR's own checkout (independent .git, seeded from
          # the canonical clone's origin remote); later deploys just fetch+checkout in
          # it. PR_NUMBER + image tags are injected on the compose line; DOMAIN and the
          # preview-scoped secrets come from the NON-PROD preview env file (never the
          # prod .env). Public migrations run at container boot (MIGRATIONS_ON_BOOT).
          ssh -i ~/.ssh/deploy_key "${SSH_USER}@${SSH_HOST}" bash -euo pipefail <<EOF
          if [ ! -d "${preview_dir}/.git" ]; then
            mkdir -p "\$(dirname "${preview_dir}")"
            git clone "\$(git -C "${canonical_dir}" remote get-url origin)" "${preview_dir}"
          fi
          cd "${preview_dir}"
          git fetch origin --force
          git checkout --force "${HEAD_SHA}"
          PR_NUMBER="${PR_NUMBER}" PHP_IMAGE="${php_image}" PWA_IMAGE="${pwa_image}" \
            docker compose --env-file "${preview_env_file}" -p "pr-${PR_NUMBER}" \
              -f compose.yaml -f deploy/preview/compose.yaml up -d --pull always
          EOF

  teardown-preview:
    name: Tear down PR preview on the VM over SSH
    runs-on: ubuntu-latest
    # Runs on PR close/merge only. No `needs: build-images` — that job is skipped on
    # `closed`, and a skipped need would cascade-skip this teardown.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
      # Pinned host key (optional), same secret as deploy-prod / deploy-preview.
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
      REPO_DIR: ${{ secrets.PROD_REPO_DIR }}
      PREVIEW_ROOT: ${{ secrets.PREVIEW_REPO_ROOT }}
      PREVIEW_ENV_FILE: ${{ secrets.PREVIEW_ENV_FILE }}
      PR_NUMBER: ${{ github.event.number }}
    steps:
      - name: Tear down preview over SSH
        # Same no-op guard as deploy-preview: nothing to reclaim without SSH secrets.
        run: |
          if [ -z "${SSH_HOST}" ] || [ -z "${SSH_USER}" ] || [ -z "${SSH_KEY}" ]; then
            echo "SSH_HOST/SSH_USER/SSH_KEY not configured - skipping preview teardown."
            exit 0
          fi
          preview_dir="${PREVIEW_ROOT:-/opt/bike-trip-planner-previews}/pr-${PR_NUMBER}"
          # Same NON-PROD preview env file as the deploy — never the prod .env.
          preview_env_file="${PREVIEW_ENV_FILE:-${PREVIEW_ROOT:-/opt/bike-trip-planner-previews}/preview.env}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "${SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Prefer the pinned host key (SSH_KNOWN_HOSTS) over a live TOFU scan — same
          # pattern as deploy-prod. Falls back to ssh-keyscan when unset (beta).
          if [ -n "${SSH_KNOWN_HOSTS}" ]; then
            printf '%s\n' "${SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "${SSH_HOST}" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          # Tear the pr-<n> stack down from its own checkout, then remove that
          # checkout dir. `down -v` drops the isolated PG-app + redis volumes (no data
          # to keep); --remove-orphans in case a service was renamed between deploys.
          # `|| true` so a stack already gone (deploy never ran) still reclaims the dir.
          ssh -i ~/.ssh/deploy_key "${SSH_USER}@${SSH_HOST}" bash -euo pipefail <<EOF
          if [ -d "${preview_dir}/.git" ]; then
            cd "${preview_dir}"
            PR_NUMBER="${PR_NUMBER}" \
              docker compose --env-file "${preview_env_file}" -p "pr-${PR_NUMBER}" \
                -f compose.yaml -f deploy/preview/compose.yaml down -v --remove-orphans || true
          fi
          rm -rf "${preview_dir}"
          EOF
