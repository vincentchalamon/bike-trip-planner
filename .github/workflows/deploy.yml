name: Deploy

on:
  # Prod deploys only on a version tag: a tag marks a deliberate stable release
  # and a clear rollback point (deploy-prod is gated on github.ref_type == 'tag').
  push:
    tags: ['v*']
  # PRs build (and, same-repo, push) a pr-<n> image for the preview stacks (W3),
  # then deploy-preview rolls the per-PR stack. `closed` is included so
  # teardown-preview can drop the stack when the PR is closed/merged; build-images
  # and deploy-preview guard themselves off the `closed` action.
  # Restricted to same-repo PRs at the job level so forks never build or push.
  pull_request:
    types: [opened, synchronize, reopened, closed]

# Read-only by default; only build-images gets packages: write. Prod secrets
# (SSH, Sentry, incident PAT) live in the `production` environment, restricted to
# `v*` tags, so a pull_request run cannot read them even with an edited workflow.
# Preview SSH secrets live in the `preview` environment, and that key can only run
# the VM's forced command (btp-preview), never a shell.
permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: vincentchalamon/bike-trip-planner

jobs:
  build-images:
    name: Build & push ${{ matrix.service }} image
    # Native arm64 hosted runner (GA, free for public repos) — replaces the slow
    # QEMU emulation on ubuntu-latest. If these runners are ever unavailable for
    # this repo, fall back to `runs-on: ubuntu-latest` + the setup-qemu-action
    # step (removed below) with `platforms: arm64`.
    runs-on: ubuntu-24.04-arm
    # Same-repo only: a fork PR must never build or push to our GHCR. Never on a
    # `closed` PR (that event only drives teardown-preview — nothing to build).
    if: >-
      github.event.action != 'closed' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      packages: write
    # One output per service (each matrix leg sets only its own key), consumed by
    # deploy-prod / deploy-preview to deploy by digest rather than by mutable tag.
    outputs:
      php_digest: ${{ steps.digest.outputs.php }}
      pwa_digest: ${{ steps.digest.outputs.pwa }}
      provisioner_digest: ${{ steps.digest.outputs.provisioner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: php
            dockerfile: .docker/php/Dockerfile
            target: frankenphp_prod
          - service: pwa
            dockerfile: .docker/pwa/Dockerfile
            target: prod
          - service: provisioner
            dockerfile: .docker/provisioner/Dockerfile
            target: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # No QEMU: the runner is natively arm64, so buildx builds linux/arm64 directly.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          PR_NUMBER: ${{ github.event.number }}
          SHA: ${{ github.sha }}
          SERVICE: ${{ matrix.service }}
        # Release images and PR images live in DIFFERENT packages: a PR run only
        # ever pushes `<service>-preview:pr-<n>`, never into the release package.
        run: |
          if [ "${REF_TYPE}" = "tag" ]; then
            PACKAGE="bike-trip-planner-${SERVICE}"
            IMAGE="${REGISTRY}/${IMAGE_OWNER}-${SERVICE}"
            TAGS="${IMAGE}:${SHA},${IMAGE}:${REF_NAME}"
          elif [ "${EVENT_NAME}" = "pull_request" ]; then
            PACKAGE="bike-trip-planner-${SERVICE}-preview"
            IMAGE="${REGISTRY}/${IMAGE_OWNER}-${SERVICE}-preview"
            TAGS="${IMAGE}:pr-${PR_NUMBER}"
          else
            echo "Unexpected event ${EVENT_NAME} (${REF_TYPE})" >&2
            exit 1
          fi
          {
            echo "tags=${TAGS}"
            echo "image=${IMAGE}"
            echo "package=${PACKAGE}"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            NEXT_PUBLIC_APP_RELEASE=${{ github.sha }}
            NEXT_PUBLIC_APP_ENV=production
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          # SENTRY_AUTH_TOKEN is intentionally NOT mounted here. Without it
          # withSentryConfig is a no-op, so the deployed image never emits the
          # `.map` files (deleteSourcemapsAfterUpload only deletes *after* a
          # successful upload, which needs org/project/url absent from this
          # build). Source-map upload to GlitchTip happens in the dedicated
          # `upload-sourcemaps` job, which builds with all SENTRY_* present.
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
          provenance: false

      # provenance: false -> a single-platform manifest, so this digest is what
      # `docker pull <image>@<digest>` resolves on the VM.
      - name: Record image digest
        id: digest
        env:
          SERVICE: ${{ matrix.service }}
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ steps.tags.outputs.image }}
        run: |
          if ! [[ "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Unexpected digest '${DIGEST}' for ${SERVICE}" >&2
            exit 1
          fi
          echo "${SERVICE}=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "- \`${IMAGE}@${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"

      # Keep the registry tidy: retain the 10 most recent versions of each
      # image (enough rollback targets) and prune the rest. GHCR storage is
      # free for this public repo, so this is hygiene, not a cost control.
      # ignore-versions keeps every vX.Y.Z release image: rollback redeploys an
      # earlier tag by its recorded digest, which must still exist on GHCR.
      - name: Prune old image versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ steps.tags.outputs.package }}
          package-type: container
          min-versions-to-keep: 10
          ignore-versions: '^v[0-9]+\.[0-9]+\.[0-9]+$'

  upload-sourcemaps:
    name: Upload PWA source maps to GlitchTip
    runs-on: ubuntu-latest
    needs: build-images
    # Source maps track a released bundle only — skip on PR builds.
    if: github.ref_type == 'tag'
    # SENTRY_* are `production` environment secrets (tag-only).
    environment: production
    # SENTRY_AUTH_TOKEN is NOT job-wide: only the gate and the build step see it,
    # so `npm ci` (dependency install scripts) runs without it.
    env:
      SENTRY_URL: ${{ secrets.SENTRY_URL }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
      SHA: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Skip when Sentry/GlitchTip is not configured
        id: gate
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          if [ -z "${SENTRY_AUTH_TOKEN}" ] || [ -z "${SENTRY_URL}" ] || [ -z "${SENTRY_ORG}" ] || [ -z "${SENTRY_PROJECT}" ]; then
            echo "Sentry/GlitchTip secrets missing — skipping source map upload."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: pwa/package-lock.json

      - name: Install PWA dependencies
        if: steps.gate.outputs.skip != 'true'
        working-directory: pwa
        run: npm ci

      - name: Build PWA and upload source maps via withSentryConfig
        if: steps.gate.outputs.skip != 'true'
        working-directory: pwa
        # withSentryConfig creates the release and uploads the source maps during
        # the build itself (all four SENTRY_* vars are present in this step's env),
        # then deletes the .map files (deleteSourcemapsAfterUpload). A separate
        # `@sentry/cli releases files upload-sourcemaps` step would find nothing —
        # so it is intentionally omitted; the plugin owns the upload.
        #
        # These NEXT_PUBLIC_* values MUST mirror the Docker image build args
        # exactly — any divergence changes the inlined config and the emitted
        # chunk hashes, so the uploaded maps would no longer match the deployed
        # bundle and symbolication would silently fail.
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          NEXT_PUBLIC_APP_RELEASE: ${{ github.sha }}
          NEXT_PUBLIC_APP_ENV: production
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
        run: npm run build

  deploy-prod:
    name: Deploy tag to the prod VM over SSH
    runs-on: ubuntu-latest
    # Source-map upload is a diagnostic aid, not a deploy gate: GlitchTip shares
    # the Oracle VM and is most likely degraded during a heavy deploy, so a
    # transient @sentry/cli failure must not block shipping the new images.
    needs: build-images
    # Prod = version tags only. Rollback = re-run this job on an earlier tag (a
    # re-run reuses build-images' recorded digests), or deploy-prod.sh on the VM.
    if: github.ref_type == 'tag'
    # The prod SSH secrets are `production` environment secrets, whose deployment
    # policy only admits `v*` tags: no pull_request run can read them.
    environment: production
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
      # Pinned host key. Mandatory: there is no ssh-keyscan (TOFU) fallback.
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
      # Repo checkout path on the VM (Ansible-provisioned). Defaults if unset.
      REPO_DIR: ${{ secrets.PROD_REPO_DIR }}
      TAG: ${{ github.ref_name }}
      COMMIT: ${{ github.sha }}
      PHP_DIGEST: ${{ needs.build-images.outputs.php_digest }}
      PWA_DIGEST: ${{ needs.build-images.outputs.pwa_digest }}
      PROVISIONER_DIGEST: ${{ needs.build-images.outputs.provisioner_digest }}
    steps:
      - name: Deploy over SSH
        # No-op when SSH secrets are absent — same transition-safety contract as
        # the former Coolify webhook. Until the Ansible/SSH infra is in place, a
        # tag push builds+pushes images and this job cleanly skips the deploy.
        run: |
          if [ -z "${SSH_HOST}" ] || [ -z "${SSH_USER}" ] || [ -z "${SSH_KEY}" ]; then
            echo "SSH_HOST/SSH_USER/SSH_KEY not configured - skipping prod deploy."
            exit 0
          fi
          if [ -z "${SSH_KNOWN_HOSTS}" ]; then
            echo "SSH_KNOWN_HOSTS is not set: refusing to trust the VM host key on first use." >&2
            exit 1
          fi
          repo_dir="${REPO_DIR:-/opt/bike-trip-planner}"
          # Every value below is re-parsed by the remote shell, so each one must
          # match a strict pattern before it is interpolated (a git tag name may
          # contain $(), backticks, etc.).
          if ! [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Refusing to deploy: TAG '${TAG}' is not a plain version tag" >&2
            exit 1
          fi
          if ! [[ "${COMMIT}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Refusing to deploy: unexpected commit '${COMMIT}'" >&2
            exit 1
          fi
          for digest in "${PHP_DIGEST}" "${PWA_DIGEST}" "${PROVISIONER_DIGEST}"; do
            if ! [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "Refusing to deploy: unexpected image digest '${digest}'" >&2
              exit 1
            fi
          done
          if ! [[ "${repo_dir}" =~ ^/[A-Za-z0-9._/-]+$ ]]; then
            echo "Refusing to deploy: unexpected PROD_REPO_DIR '${repo_dir}'" >&2
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "${SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          # deploy-prod.sh (Ansible-rendered) records the tag -> commit + image
          # digests on first deploy and refuses a different set for a tag it has
          # already recorded; it then checks out the tag and rolls the stack
          # through btp-compose, which runs the images by those digests.
          ssh -o StrictHostKeyChecking=yes -i ~/.ssh/deploy_key "${SSH_USER}@${SSH_HOST}" \
            "${repo_dir}/deploy-prod.sh" "${TAG}" "${COMMIT}" "${PHP_DIGEST}" "${PWA_DIGEST}" "${PROVISIONER_DIGEST}"

  smoke-test:
    name: Smoke test post-deploy
    runs-on: ubuntu-latest
    needs: deploy-prod
    # A tag-skipped deploy-prod counts as "success" for needs, so pin to tags:
    # never probe real prod (nor dispatch an incident) on a PR build.
    if: success() && github.ref_type == 'tag'
    # INCIDENT_DISPATCH_TOKEN / PROD_HEALTH_URL are `production` environment secrets.
    environment: production
    # Prod host to probe. Override PROD_HEALTH_URL only to probe another host.
    env:
      HEALTH_URL: ${{ secrets.PROD_HEALTH_URL || 'https://www.bike-trip-planner.com' }}
    steps:
      - name: Wait for the new image to roll
        run: sleep 60

      - name: Probe /api/healthz with retry
        run: |
          set +e
          for attempt in 1 2 3; do
            if curl -fsS --max-time 10 "${HEALTH_URL}/api/healthz"; then
              exit 0
            fi
            if [ "${attempt}" -lt 3 ]; then
              echo "Attempt ${attempt} failed, retrying in 30s..."
              sleep 30
            fi
          done
          exit 1

      - name: Probe /api/health and assert overall status
        run: |
          # Retried, unlike before: readiness now requires a live Messenger consumer
          # (ADR-075), and the workers only start once `php` is healthy (start_period
          # 30s), with their first heartbeat a few seconds later. The sleep above left
          # 10-20s of margin, which a slow `--pull always` eats — a green deploy would
          # have failed on a race. A deploy that genuinely leaves no worker running
          # must still fail here: that is the point.
          set +e
          for attempt in 1 2 3 4 5 6; do
            response=$(curl -fsS --max-time 10 "${HEALTH_URL}/api/health")
            echo "$response"
            if echo "$response" | jq -e '.status == "ok"' >/dev/null; then
              exit 0
            fi
            if [ "${attempt}" -lt 6 ]; then
              echo "Attempt ${attempt}: readiness not ok yet, retrying in 15s..."
              sleep 15
            fi
          done
          exit 1

      - name: Open incident on smoke-test failure
        if: failure()
        env:
          INCIDENT_TOKEN: ${{ secrets.INCIDENT_DISPATCH_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          if [ -z "${INCIDENT_TOKEN}" ]; then
            echo "INCIDENT_DISPATCH_TOKEN not configured — cannot raise incident."
            exit 1
          fi
          curl -fsS -X POST \
            "https://api.github.com/repos/${REPO}/dispatches" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${INCIDENT_TOKEN}" \
            -d "{\"event_type\":\"uptime_alert\",\"client_payload\":{\"source\":\"deploy-smoke\",\"sha\":\"${SHA}\",\"status\":\"down\"}}"

  deploy-preview:
    name: Deploy PR preview to the VM over SSH
    runs-on: ubuntu-latest
    needs: build-images
    # Same-repo PRs only (a fork must never reach the VM), and never on `closed`
    # (that action is teardown-preview's).
    #
    # What the PR controls is its images, nothing else. The SSH key in the
    # `preview` environment belongs to a dedicated VM user whose authorized_keys
    # entry forces `btp-preview` (Ansible, app_deploy role): it accepts only
    # `deploy <pr> <php-digest> <pwa-digest>` / `teardown <pr>`, pulls the images
    # from the -preview packages by digest, and runs the compose files of the
    # VM's own `main` checkout. Nothing from the PR checkout is ever executed on
    # the host, and previews sit on their own networks (edge-preview,
    # btp-shared-preview), never on prod's.
    #
    # OPERATIONAL GUARD — concurrent-preview cap. Each preview budgets ~2 GB / ~2
    # vCPU (deploy/preview/compose.yaml caps). On the shared 24 GB / 4-core VM, prod
    # (~6-7 GB) leaves room for roughly 4-5 concurrent previews before contention.
    # There is no auto-eviction here: keep the count in check by closing stale PRs
    # (teardown-preview reclaims on close) and with the `preview` environment's
    # required reviewers. Raising the cap means shrinking the per-preview limits or
    # growing the VM.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    environment: preview
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
      # Pinned host key. Mandatory: there is no ssh-keyscan (TOFU) fallback.
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
      PR_NUMBER: ${{ github.event.number }}
      PHP_DIGEST: ${{ needs.build-images.outputs.php_digest }}
      PWA_DIGEST: ${{ needs.build-images.outputs.pwa_digest }}
    steps:
      - name: Deploy preview over SSH
        # No-op when SSH secrets are absent — same transition-safety contract as
        # deploy-prod.
        run: |
          if [ -z "${SSH_HOST}" ] || [ -z "${SSH_USER}" ] || [ -z "${SSH_KEY}" ]; then
            echo "SSH_HOST/SSH_USER/SSH_KEY not configured - skipping preview deploy."
            exit 0
          fi
          if [ -z "${SSH_KNOWN_HOSTS}" ]; then
            echo "SSH_KNOWN_HOSTS is not set: refusing to trust the VM host key on first use." >&2
            exit 1
          fi
          # btp-preview validates these again on the VM; checking here gives a
          # readable failure in the job log.
          if ! [[ "${PR_NUMBER}" =~ ^[1-9][0-9]{0,5}$ ]]; then
            echo "Unexpected PR number '${PR_NUMBER}'" >&2
            exit 1
          fi
          for digest in "${PHP_DIGEST}" "${PWA_DIGEST}"; do
            if ! [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "Unexpected image digest '${digest}'" >&2
              exit 1
            fi
          done
          install -d -m 700 ~/.ssh
          printf '%s\n' "${SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          # The remote command is only read by the forced command, as
          # SSH_ORIGINAL_COMMAND; the key cannot open a shell.
          ssh -o StrictHostKeyChecking=yes -i ~/.ssh/deploy_key "${SSH_USER}@${SSH_HOST}" \
            deploy "${PR_NUMBER}" "${PHP_DIGEST}" "${PWA_DIGEST}"

  teardown-preview:
    name: Tear down PR preview on the VM over SSH
    runs-on: ubuntu-latest
    # Runs on PR close/merge only. No `needs: build-images` — that job is skipped on
    # `closed`, and a skipped need would cascade-skip this teardown.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    environment: preview
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
      PR_NUMBER: ${{ github.event.number }}
    steps:
      - name: Tear down preview over SSH
        # Same no-op guard as deploy-preview: nothing to reclaim without SSH secrets.
        run: |
          if [ -z "${SSH_HOST}" ] || [ -z "${SSH_USER}" ] || [ -z "${SSH_KEY}" ]; then
            echo "SSH_HOST/SSH_USER/SSH_KEY not configured - skipping preview teardown."
            exit 0
          fi
          if [ -z "${SSH_KNOWN_HOSTS}" ]; then
            echo "SSH_KNOWN_HOSTS is not set: refusing to trust the VM host key on first use." >&2
            exit 1
          fi
          if ! [[ "${PR_NUMBER}" =~ ^[1-9][0-9]{0,5}$ ]]; then
            echo "Unexpected PR number '${PR_NUMBER}'" >&2
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "${SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          # btp-preview runs `docker compose -p pr-<n> down -v` (drops the isolated
          # PG-app + redis volumes) and succeeds when the stack is already gone.
          ssh -o StrictHostKeyChecking=yes -i ~/.ssh/deploy_key "${SSH_USER}@${SSH_HOST}" \
            teardown "${PR_NUMBER}"
