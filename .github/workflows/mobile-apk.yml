name: Mobile APK

# Builds the Android APK and attaches it to the GitHub Release as
# bike-trip-planner.apk. Kept out of deploy.yml on purpose: the mobile app is not
# dockerized and is not part of the server deploy (ADR-053). Signed with the
# private release keystore held in the `release` environment's secrets (injected
# by mobile/plugins/withReleaseSigning.js); the job fails without them rather than
# falling back to the public debug keystore. See docs/runbooks/mobile-release-build.md.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build and attach the APK to (e.g. v0.1.0-beta.1)'
        required: true

permissions:
  contents: write

concurrency:
  group: mobile-apk-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build-apk:
    name: Build and attach bike-trip-planner.apk
    runs-on: ubuntu-latest
    # Protected environment: the keystore secrets are only readable from here.
    environment: release
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      # Inlined into the JS bundle at build time; the app fails closed without
      # them (see mobile-release-build.md). Defaults are the production values —
      # override with the repo variables only to build against another host.
      EXPO_PUBLIC_API_URL: ${{ vars.MOBILE_API_URL || 'https://www.bike-trip-planner.com' }}
      EXPO_PUBLIC_WEB_URL: ${{ vars.MOBILE_WEB_URL || 'https://www.bike-trip-planner.com' }}
      EXPO_PUBLIC_CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL || 'contact@bike-trip-planner.com' }}
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install workspaces
        run: npm ci

      - name: Prebuild the Android project (Expo CNG)
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install

      - name: Decode the release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for var in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!var}" ]; then
              echo "::error::Secret $var is missing from the 'release' environment; refusing to build a debug-signed APK."
              exit 1
            fi
          done
          keystore="$RUNNER_TEMP/release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          echo "ANDROID_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      - name: Assemble the release APK (release-signed)
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify the APK is signed with the release keystore
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          # The Expo/React Native template's public debug keystore.
          debug_fp="FAC61745DC0903786FB9EDE62A962B399F7348F0BB6F899B8332667591033B9C"
          expected=$(keytool -J-Duser.language=en -list -v -keystore "$ANDROID_KEYSTORE_PATH" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" \
            | awk '/SHA256:/ {print $2}' | tr -d ':' | tr '[:lower:]' '[:upper:]')
          apksigner=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)/apksigner
          actual=$("$apksigner" verify --print-certs mobile/android/app/build/outputs/apk/release/app-release.apk \
            | awk -F': ' '/certificate SHA-256 digest/ {print $NF}' | sort -u | tr '[:lower:]' '[:upper:]')
          echo "Release keystore SHA-256: $expected"
          echo "APK signer SHA-256:       $actual"
          if [ -z "$actual" ] || [ "$actual" = "$debug_fp" ] || [ "$actual" != "$expected" ]; then
            echo "::error::The APK is not signed with the release keystore."
            exit 1
          fi

      - name: Rename the APK
        run: |
          src="mobile/android/app/build/outputs/apk/release/app-release.apk"
          test -f "$src" || { echo "APK not found at $src"; exit 1; }
          cp "$src" bike-trip-planner.apk

      - name: Attach the APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" bike-trip-planner.apk --clobber --repo "$GITHUB_REPOSITORY"
