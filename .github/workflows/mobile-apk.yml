name: Mobile APK

# Builds the Android APK and attaches it to the GitHub Release as
# bike-trip-planner.apk. Kept out of deploy.yml on purpose: the mobile app is not
# dockerized and is not part of the server deploy (ADR-053). Debug-signed release
# build (the Expo template's default release signingConfig uses the deterministic
# debug keystore), so no signing secret is required. For a real release keystore,
# see docs/runbooks/mobile-release-build.md.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build and attach the APK to (e.g. v0.1.0-beta.1)'
        required: true

permissions:
  contents: write

concurrency:
  group: mobile-apk-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build-apk:
    name: Build and attach bike-trip-planner.apk
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      # Inlined into the JS bundle at build time; a non-dev build fails closed
      # without it (see mobile-release-build.md). Point vars.MOBILE_API_URL at the
      # API host reachable from the phone once it exists.
      EXPO_PUBLIC_API_URL: ${{ vars.MOBILE_API_URL || 'https://biketrip.mooo.com' }}
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install workspaces
        run: npm ci

      - name: Prebuild the Android project (Expo CNG)
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install

      - name: Assemble the release APK (debug-signed)
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename the APK
        run: |
          src="mobile/android/app/build/outputs/apk/release/app-release.apk"
          test -f "$src" || { echo "APK not found at $src"; exit 1; }
          cp "$src" bike-trip-planner.apk

      - name: Attach the APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" bike-trip-planner.apk --clobber --repo "$GITHUB_REPOSITORY"
