name: Lighthouse

# Heavy job: boots the iso-prod stack and runs Lighthouse CI on the public pages.
# Manual trigger only (workflow_dispatch) — the project favours manual execution
# over automatic crons (cf. osm-cron dropped for manual refresh, #575).
on:
  workflow_dispatch: ~

jobs:
  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    env:
      COMPOSE_FILE: compose.yaml
      WORKER_REPLICAS: 1
      JWT_PASSPHRASE: "ci-test-passphrase"
      FRONTEND_URL: "https://localhost"
      MAILER_DSN: "null://null"
      # The MCP authorization server's own passphrase and at-rest encryption key (ADR-079).
      # NB: this workflow still lacks MERCURE_JWT_KEY, REFRESH_TOKEN_ENC_KEY and APP_SECRET,
      # so the prod image's older fail-closed guards stop it before these ever matter.
      OAUTH_PASSPHRASE: "ci-test-passphrase"
      OAUTH_ENCRYPTION_KEY: "ci-test-oauth-encryption-key"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      # Two keypairs, and they must differ or the prod image refuses to boot (ADR-079).
      # One script knows both (#1309); the paths stay exported here, as Actions plumbing.
      - name: Generate keypairs
        run: |
          ./scripts/generate-keypairs.sh \
            --jwt api/config/jwt --oauth api/config/oauth \
            --passphrase ci-test-passphrase --force
          echo "JWT_PRIVATE_KEY_PATH=${{ github.workspace }}/api/config/jwt/private.pem" >> "$GITHUB_ENV"
          echo "JWT_PUBLIC_KEY_PATH=${{ github.workspace }}/api/config/jwt/public.pem" >> "$GITHUB_ENV"
          echo "OAUTH_PRIVATE_KEY_PATH=${{ github.workspace }}/api/config/oauth/private.pem" >> "$GITHUB_ENV"
          echo "OAUTH_PUBLIC_KEY_PATH=${{ github.workspace }}/api/config/oauth/public.pem" >> "$GITHUB_ENV"
      - name: Build Docker images
        uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        with:
          load: true
          files: |
            compose.yaml
          set: |
            *.platform=linux/amd64
            php.cache-from=type=gha,scope=php
            php.cache-from=type=gha,scope=php-main
            pwa.cache-from=type=gha,scope=pwa
            pwa.cache-from=type=gha,scope=pwa-main
      - name: Start services
        run: docker compose up -d database php pwa worker redis --no-build --wait
      - name: Run Lighthouse
        run: make lighthouse
      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-report
          path: pwa/.lighthouseci/
          retention-days: 14
      - name: Debug services on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs
