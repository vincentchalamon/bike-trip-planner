# yaml-language-server: $schema=https://raw.githubusercontent.com/squidfunk/mkdocs-material/refs/heads/master/docs/schema.json
site_name: Bike Trip Planner
site_description: A bikepacking trip planner — smart pacing, safety alerts, and accommodation suggestions from a Komoot URL or a GPX file.
site_author: Vincent Chalamon
repo_name: vincentchalamon/bike-trip-planner
repo_url: https://github.com/vincentchalamon/bike-trip-planner
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: .mkdocs
strict: true

theme:
  name: material
  palette:
    - scheme: default
      toggle:
        icon: material/toggle-switch
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to light mode
  features:
    - navigation.top
    - navigation.instant
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables

# Documentation trees that are not part of the published site:
#   - the repo-level docs index (README.md) conflicts with index.md as the home page;
#   - recette/ carries design JSX exports and manual-test scripts, not reference docs;
#   - audit/ holds one-off measurement reports linked contextually from the pages above.
exclude_docs: |
  /README.md
  recette/
  audit/

# Internal links across the ADRs and runbooks point liberally at source files and at the
# repo-root README, i.e. outside docs_dir; those cannot resolve inside the built site and
# are intentionally not treated as build failures. Nav coherence stays strict.
validation:
  nav:
    omitted_files: info
    not_found: warn
    absolute_links: info
  links:
    not_found: ignore
    anchors: ignore
    absolute_links: ignore
    unrecognized_links: ignore

nav:
